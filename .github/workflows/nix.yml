name: Nix

# Builds the flake package on both Linux architectures and pushes the results to
# the portunus.cachix.org binary cache, so `nix run github:SzilBalazs/portunus`
# does not make users compile a Tauri app from scratch. (That cache belongs to
# upstream; this fork has no push token, so here the step only reads from it.) The cache is for
# consumers, not for CI turnaround: Nix builds are all-or-nothing, so unlike the
# release workflow (which keeps an incremental Rust cache) every source change
# here is a full rebuild. `packaging/nix/unwrapped.nix` filters `src` down to the
# files the build actually reads, which is what keeps a docs-only commit from
# invalidating everyone's cache hit.
#
# The cachix step must sit after Nix is installed and before any build - it finds
# what to push by diffing the store. On pull requests from forks the auth token
# secret is empty; the step then only reads from the cache instead of failing.

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 runners are free for public repos, so aarch64-linux is
          # actually tested rather than just claimed in `systems`.
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          # The runner user is trusted, so the flake's own nixConfig
          # substituters apply without a prompt.
          extra_nix_config: |
            accept-flake-config = true

      - uses: cachix/cachix-action@v16
        with:
          name: portunus
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Source tarballs are already on cache.nixos.org; no point mirroring.
          pushFilter: "(-source$|\\.tar\\.(gz|xz|bz2)$)"

      - name: Build package
        run: nix build .#packages.${{ matrix.system }}.default --print-build-logs

      - name: Build dev shell inputs
        # Cached separately so a contributor's first `nix develop` is a download
        # rather than a toolchain build.
        run: nix build .#devShells.${{ matrix.system }}.default.inputDerivation --print-build-logs

      - name: Flake check
        run: nix flake check --print-build-logs
