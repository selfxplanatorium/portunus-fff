[workspace]
members = [".", "crates/*"]
resolver = "2"

[package]
name = "portunus"
version = "0.7.0"
license = "Apache-2.0"
description = "Application launcher and power-user search for Wayland"
authors = ["SzilBalazs"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "portunus_lib"
crate-type = ["rlib"]

[profile.release]
lto = "thin"          # cross-crate inlining; "thin" keeps build time sane vs "fat"
codegen-units = 1     # better optimization at cost of slower compile

[profile.dev]
# Backtraces keep file:line; variable inspection in a debugger is gone. Cuts the
# debug binary from ~750 MB to tens of MB, which is most of the incremental
# relink cost of the dev loop.
debug = "line-tables-only"
split-debuginfo = "unpacked"   # DWARF stays in the .o files instead of being copied into the binary

[profile.dev.package."*"]
debug = false                  # no debuginfo for the 800+ dependency crates

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nucleo-matcher = "0.3"
walkdir = "2"
# File-name index: parallel walk + inotify watcher + SIMD fuzzy matcher over the
# configured roots. Default `ripgrep` backend keeps the build Zig-free.
fff-search = "0.11.0"
fend-core = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "0.10", default-features = false }
pdfium-render = { version = "0.8", features = ["image"] }
# No `default-features`: the default format set pulls ravif -> rav1e (an AVIF
# *encoder*, one of the slowest crates in the tree) plus exr/dds/hdr/qoi, none of
# which are icon or document formats. pdfium-render already takes image with
# default-features = false, so this line is the only thing that pulled them in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "rayon"] }
# Dominant-color sampling only averages pixels, so the usvg text stack (fontdb,
# rustybuzz, ttf-parser, fontconfig-parser) is dead weight; `raster-images` stays
# so svg icons that embed a png/jpeg still sample correctly.
resvg = { version = "0.44", default-features = false, features = ["raster-images"] } # pure-Rust SVG rasterizer for dominant-color sampling of svg icons
base64 = "0.22"         # decode extension-supplied icon bytes for dominant-color sampling
roxmltree = "0.20"
toml = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rayon = "1"
leptess = "0.14"
notify-debouncer-full = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
# extism already pins the wasmtime features it needs (cranelift, cache, gc,
# coredump, wat, parallel-compilation, pooling-allocator, demangle) with
# default-features = false. Its default `wasmtime-default-features` adds
# component-model/async/profiling/threads on top - wasm-compose,
# fxprof-processed-profile, component macros - none of which the host uses.
extism = { version = "1.30.0", default-features = false, features = ["http", "register-http", "register-filesystem"] }
# Only here to unify `wasmtime/std` back on: extism's code needs `wasmtime::Error`
# to implement std::error::Error, which the default-feature set provided. Keep the
# version in step with extism's wasmtime requirement.
wasmtime = { version = "43", default-features = false, features = ["std", "anyhow"] }
portunus-ext-sdk = { path = "../extension-sdk", default-features = false }
# Split out so an edit in the host does not recompile 38k lines of office parsing.
portunus-office = { path = "crates/portunus-office" }
portunus-text = { path = "crates/portunus-text" }
tokio = { version = "1", features = ["sync"] }   # oneshot reply for the pdfium worker (already in tree via tauri)
sha2 = "0.11.0"
ureq = { version = "2", default-features = false, features = ["tls"] }
wasmparser = "0.252.0"
tauri-plugin-dialog = "2.7.1"
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] } # extension secret settings (org.freedesktop.secrets)

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"            # must match tao's gtk version (see Cargo.lock)
gio = "0.18"            # .desktop launching (GDesktopAppInfo); same version gtk pulls in
libc = "0.2"            # setsid() in the post-fork hook of launch_desktop_entry
gtk-layer-shell = { version = "0.8", features = ["v0_6"] } # wlr-layer-shell overlay; v0_6 for set_keyboard_mode
